name: Build WARP test APK

on:
  workflow_dispatch:
  push:
    branches:
      - warp-builtin
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest

    - name: Build debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        sed -i 's/^\(\s*\)versionName = \(.*\)$/&\n\1applicationIdSuffix = ".warp"\n\1versionNameSuffix = "-warp"/' app/build.gradle.kts
        grep -n 'applicationIdSuffix = ".warp"' app/build.gradle.kts
        ./gradlew :app:assemblePlaystoreDebug

    - name: Upload test reports
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: unit-test-reports
        path: ${{ github.workspace }}/V2rayNG/app/build/reports/tests/

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      with:
        name: warp-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      with:
        name: warp-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*universal*.apk

    - name: Publish APKs to the warp-apk branch
      run: |
        mkdir -p "$RUNNER_TEMP/apk"
        cp V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk "$RUNNER_TEMP/apk/v2rayNG-WARP-arm64-v8a.apk"
        cp V2rayNG/app/build/outputs/apk/playstore/debug/*universal*.apk "$RUNNER_TEMP/apk/v2rayNG-WARP-universal.apk"
        cd "$RUNNER_TEMP/apk"
        git init -q -b warp-apk
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        echo "Built from ${GITHUB_SHA}" > BUILD.txt
        git add -A
        git commit -q -m "WARP APK from ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" warp-apk
